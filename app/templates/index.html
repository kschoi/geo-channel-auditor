<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geo Channel Auditor · 상권 채널 진단</title>
  <meta name="description" content="동네와 매장을 한 줄로 입력하면 Liner Search·Search Agent가 인용한 채널을 분석해 빠진 정보 3가지와 발행용 콘텐츠를 만들어 드립니다." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233182F6'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="0.75" y="0.75" width="22.5" height="22.5" rx="7" fill="#3182F6" />
        <circle cx="12" cy="12" r="4.9" fill="none" stroke="#fff" stroke-width="1.6" />
        <circle cx="12" cy="12" r="1.4" fill="#fff" />
      </svg>
      <span class="brand-name">Geo Channel Auditor</span>
    </a>
    <span id="mode-badge" class="mode-badge" data-mode="{{ 'live' if mode == 'live' else 'demo' }}">
      <i class="mode-dot" aria-hidden="true"></i>
      <span id="mode-label">{{ 'LIVE' if mode == 'live' else 'DEMO' }}</span>
    </span>
  </div>
</header>

<main class="wrap page">

  <section class="hero">
    <h1 class="hero-title">우리 가게에 빠진<br class="br-mobile" /> 검색 정보, 바로 찾아드려요</h1>
  </section>

  <!-- 단일 검색 입력 -->
  <form id="audit-form" class="card search-card" autocomplete="off">
    <label class="sr-only" for="query">동네와 매장 이름</label>
    <div class="search-field">
      <svg class="search-icon" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.7" />
        <path d="m13.5 13.5 3.5 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
      <input id="query" name="query" class="search-input" type="text" enterkeyhint="search"
        placeholder="예: 성수동 모먼트 카페, 강남역 피부과" />
    </div>

    <button type="submit" id="run-btn" class="cta">
      <span id="run-btn-label">진단 시작하기</span>
    </button>

    <div class="quick-row" id="sample-list" aria-label="빠른 예시">
      <button type="button" class="pill" data-query="성수동 카페" data-sample-id="seongsu-cafe">성수동 카페</button>
      <button type="button" class="pill" data-query="서울대입구 피부과" data-sample-id="snu-derm">서울대입구 피부과</button>
      <button type="button" class="pill" data-query="홍대 버거">홍대 버거</button>
    </div>

    <div class="toggle-row">
      <button type="button" class="link-toggle" id="toggle-advanced" aria-expanded="false" aria-controls="advanced">
        + 채널 글 직접 넣기
      </button>
      <button type="button" class="link-toggle" id="toggle-api" aria-expanded="false" aria-controls="api-panel">
        API 설정
      </button>
    </div>

    <!-- 숨김 고급 입력: 위치·업종·매장명을 직접 지정하거나 운영 중인 채널 글을 붙여넣는다. -->
    <div class="advanced hidden" id="advanced">
      <div class="field-row">
        <div class="field-block">
          <label class="field-label" for="location">상권 위치</label>
          <input id="location" name="location" class="text-field" placeholder="예: 서울 성동구 성수동2가" />
        </div>
        <div class="field-block">
          <label class="field-label" for="industry">업종</label>
          <input id="industry" name="industry" class="text-field" placeholder="예: 스페셜티 카페" />
        </div>
      </div>
      <div class="field-block">
        <label class="field-label" for="store_name">매장명 <span class="optional">선택</span></label>
        <input id="store_name" name="store_name" class="text-field" placeholder="예: 모먼트 성수점" />
      </div>
      <div class="field-block">
        <div class="field-label-row">
          <label class="field-label" for="channel_text">지금 쓰는 채널 글 <span class="optional">선택</span></label>
          <span class="counter"><span id="char-count">0</span>자</span>
        </div>
        <textarea id="channel_text" name="channel_text" rows="5" class="text-field text-area"
          placeholder="인스타그램 소개, 네이버 플레이스 소개, 블로그 글을 그대로 붙여넣으세요. 비우면 공개 채널을 자동으로 찾습니다."></textarea>
        <p class="helper" id="collect-hint">비워두면 공개 채널을 자동으로 찾아 진단해요.</p>
      </div>
    </div>

    <div class="advanced hidden" id="api-panel">
      <div class="field-block">
        <label class="field-label" for="api_key">Liner API 키 <span class="optional">선택</span></label>
        <input id="api_key" type="password" class="text-field" placeholder="lin_live_..." autocomplete="off" spellcheck="false" />
        <p class="helper">이번 요청에만 쓰고 저장하지 않아요. 비워두면 서버 키를 쓰고, 없으면 데모로 진단합니다.</p>
      </div>
    </div>
  </form>

  <!-- 진행 -->
  <section id="progress" class="card progress-card hidden">
    <ol id="step-list" class="steps"></ol>
  </section>

  <!-- 오류 -->
  <section id="error" class="card error-card hidden">
    <p class="error-title">진단을 마치지 못했어요</p>
    <p id="error-detail" class="error-detail"></p>
  </section>

  <!-- 결과 -->
  <section id="results" class="results hidden"></section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>Liner .EXE-THON · 팀 클로클립</p>
  </div>
</footer>

<script id="samples-data" type="application/json">{{ samples|tojson }}</script>
<script src="/static/app.js"></script>
</body>
</html>
