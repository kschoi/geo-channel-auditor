[project]
name = "geo-channel-auditor"
version = "0.3.0"
description = "공개 후기와 상권 자료 기반 고객 인식 · 경쟁점 비교 (Liner .EXE-THON 출품작)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "최경선 (팀 클로클립)" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/kschoi/geo-channel-auditor"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["ISC004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
